name: Deploy task-1 to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'task-1/**'
      - '.github/workflows/deploy-task-1.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'task-1/package-lock.json'

      - name: Install dependencies
        working-directory: task-1
        run: npm install

      - name: Build React app
        working-directory: task-1
        run: npm run build
        env:
          PUBLIC_URL: /${{ github.event.repository.name }}/task-1

      - name: Create deployment structure
        run: |
          mkdir -p deployment/task-1
          cp -r task-1/build/* deployment/task-1/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'deployment'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
